<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Relaunch</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #0a0a0a;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      "
    >
      <h1
        style="
          color: var(--accent-color, #fbbf24);
          font-size: 40px;
          text-transform: uppercase;
          letter-spacing: 3px;
          margin-bottom: 20px;
        "
      >
        Wartungsarbeiten
      </h1>
      <p
        style="color: #aaa; font-size: 18px; max-width: 500px; line-height: 1.5"
      >
        Das Spiel wird gerade im Hintergrund stark umgebaut und mit neuen
        Inhalten befüllt.<br /><br />
        Bitte versuche es später noch einmal!
      </p>
    </div>

    <div id="app">
      <div class="visual-area" id="visual-area">
        <div id="ui-hud" class="hud-overlay"></div>

        <div id="scene-content" style="opacity: 0.3; font-size: 24px">
          [SZENE / GEGNER BILD]
        </div>
      </div>

      <div class="action-area">
        <div id="controls" style="text-align: center; color: #666">
          (Automatische Kampf-Simulation läuft...)
        </div>
      </div>
      <div
        id="log-window"
        class="draggable-window"
        style="top: 300px; left: 50px; width: 400px; height: 200px"
      >
        <div class="window-header">
          <span class="window-title">Kampfprotokoll</span>
          <div class="window-controls">
            <div class="win-btn minimize-btn">_</div>
          </div>
        </div>
        <div class="window-content" id="combat-log">
          <div class="log-entry">Willkommen im Fenstermodus.</div>
        </div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
